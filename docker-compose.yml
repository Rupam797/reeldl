services:
  redis:
    image: redis:7-alpine
    container_name: reeldl-redis
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru --appendonly no
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - reeldl-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: reeldl-backend
    restart: unless-stopped
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - YTDLP_PATH=/usr/local/bin/yt-dlp
      - GALLERYDL_PATH=gallery-dl
      - YTDLP_COOKIES_FILE=${YTDLP_COOKIES_FILE:-}
      - CACHE_TTL_MINUTES=${CACHE_TTL_MINUTES:-30}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
      - RATE_LIMIT_EXTRACT=${RATE_LIMIT_EXTRACT:-10}
      - RATE_LIMIT_DOWNLOAD=${RATE_LIMIT_DOWNLOAD:-5}
      - RATE_LIMIT_AUDIO=${RATE_LIMIT_AUDIO:-3}
      - EXTRACTION_TIMEOUT=${EXTRACTION_TIMEOUT:-20}
      - MAX_VIDEO_SIZE=${MAX_VIDEO_SIZE:-104857600}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - reeldl-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-}
        - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-http://localhost}
    container_name: reeldl-frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-http://localhost}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - reeldl-net

  nginx:
    image: nginx:alpine
    container_name: reeldl-nginx
    restart: unless-stopped
    ports:
      - "${PORT:-80}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - reeldl-net

volumes:
  redis-data:

networks:
  reeldl-net:
    driver: bridge
